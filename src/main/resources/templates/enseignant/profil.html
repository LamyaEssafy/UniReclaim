<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - UniReclaim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar-enseignant :: sidebar}"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header('Mon Profil')}"></div>

            <!-- Content Area -->
            <div class="content-area animate-fade-in-up">
                <div class="card-custom max-width-800 mx-auto">
                    <div class="card-header-custom">
                        <h4 class="mb-0">Mon Profil Enseignant</h4>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i> <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/enseignant/profil}" method="post">
                            <div class="d-flex align-items-center gap-4 mb-4 pb-4 border-bottom">
                                <div class="sidebar-user-avatar" style="width: 80px; height: 80px; font-size: 2rem;" th:text="${currentUser.initiale}">E</div>
                                <div>
                                    <h4 class="mb-1" th:text="${currentUser.prenom + ' ' + currentUser.nom}">Enseignant</h4>
                                    <p class="text-secondary mb-0" th:text="${currentUser.email}">email</p>
                                    <span class="badge bg-primary mt-2" th:text="${currentUser.role}">RÔLE</span>
                                </div>
                             </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label form-label-custom">Prénom</label>
                                    <input type="text" name="prenom" th:value="${currentUser.prenom}" class="form-control form-control-custom" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label form-label-custom">Nom</label>
                                    <input type="text" name="nom" th:value="${currentUser.nom}" class="form-control form-control-custom" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label form-label-custom">Téléphone</label>
                                    <input type="tel" name="telephone" th:value="${currentUser.telephone}" class="form-control form-control-custom">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label form-label-custom">Mot de passe (Laisser vide si inchangé)</label>
                                    <input type="password" name="password" class="form-control form-control-custom" autocomplete="new-password">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/enseignant/dashboard}" class="btn btn-light">Retour</a>
                                <button type="submit" class="btn btn-primary-custom">Enregistrer les modifications</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
