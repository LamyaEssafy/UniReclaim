<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réclamations Affectées - UniReclaim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>
<body>
    <div class="app-container">
        <div th:replace="~{fragments/sidebar-enseignant :: sidebar}"></div>

        <div class="main-content">
            <div th:replace="~{fragments/header :: header('Réclamations Reçues')}"></div>

            <div class="content-area animate-fade-in-up">
                <h3 class="mb-4">Réclamations Affectées</h3>

                <div class="data-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Étudiant</th>
                                <th>Sujet</th>
                                <th>Module</th>
                                <th>Date soumission</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${reclamations}">
                                <td>
                                    <a th:href="@{/enseignant/reclamations/{id}(id=${r.id})}" class="font-weight-bold text-decoration-none" th:text="${r.code}">REC-001</a>
                                </td>
                                <td th:text="${r.etudiant.prenom + ' ' + r.etudiant.nom}">Étudiant</td>
                                <td th:text="${r.sujet}">Sujet</td>
                                <td th:text="${r.module != null ? r.module.nom : '-'}">Module</td>
                                <td th:text="${#temporals.format(r.dateCreation, 'dd/MM/yyyy HH:mm')}">Date</td>
                                <td>
                                    <span class="badge-status" th:classappend="'badge-' + ${#strings.toLowerCase(r.statut.name()).replace('_', '-')}" th:text="${r.statut}">Statut</span>
                                </td>
                                <td>
                                    <a th:href="@{/enseignant/reclamations/{id}(id=${r.id})}" class="btn btn-sm btn-light text-primary">
                                        <i class="fas fa-reply me-1"></i> Traiter
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(reclamations)}">
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
                                    Aucune réclamation ne vous est affectée pour le moment.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
