<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - UniReclaim</title>
    <!-- CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>
<body>
    <div class="auth-container">
        <!-- Left Illustration Screen -->
        <div class="auth-left">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="auth-left-content">
                <div class="auth-illustration">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="auth-left-title">Créer un compte</h1>
                <p class="auth-left-text">
                    Rejoignez la communauté UniReclaim pour soumettre vos réclamations et suivre leur avancement étape par étape en temps réel.
                </p>
            </div>
        </div>

        <!-- Right Form Screen -->
        <div class="auth-right">
            <div class="auth-form-container" style="max-width: 450px;">
                <h2 class="auth-title">Inscription</h2>
                <p class="auth-subtitle">Créez votre compte étudiant dès maintenant</p>

                <!-- Form -->
                <form th:action="@{/register}" method="post" th:object="${utilisateur}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div class="auth-input-group mb-0">
                                <i class="fas fa-user" style="left: 12px;"></i>
                                <input type="text" th:field="*{prenom}" class="auth-input" style="padding-left: 38px;" placeholder="Prénom" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="auth-input-group mb-0">
                                <i class="fas fa-user" style="left: 12px;"></i>
                                <input type="text" th:field="*{nom}" class="auth-input" style="padding-left: 38px;" placeholder="Nom" required>
                            </div>
                        </div>
                    </div>

                    <div class="auth-input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" th:field="*{email}" class="auth-input" placeholder="Adresse email" required autocomplete="email">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="auth-input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" th:field="*{telephone}" class="auth-input" placeholder="Téléphone (ex: +2126...)" required>
                    </div>

                    <div class="auth-input-group">
                        <i class="fas fa-building" style="left: 12px; top: 16px;"></i>
                        <select th:field="*{departement}" class="auth-input" style="padding-left: 38px; color: #495057;" required>
                            <option value="">Sélectionnez votre département</option>
                            <option th:each="d : ${departements}" th:value="${d.id}" th:text="${d.nom}">Département</option>
                        </select>
                    </div>

                    <div class="auth-input-group">
                        <i class="fas fa-sitemap" style="left: 12px; top: 16px;"></i>
                        <select th:field="*{filiere}" class="auth-input" style="padding-left: 38px; color: #495057;" required>
                            <option value="">Sélectionnez votre filière</option>
                            <option th:each="f : ${filieres}" th:value="${f.id}" th:text="${f.nom}">Filière</option>
                        </select>
                    </div>

                    <div class="auth-input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" th:field="*{motDePasse}" class="auth-input" placeholder="Mot de passe" required autocomplete="new-password">
                    </div>

                    <button type="submit" class="auth-btn">S'inscrire</button>
                </form>

                <div class="auth-footer-links">
                    Déjà inscrit ? <a th:href="@{/login}" class="auth-link">Connectez-vous ici</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
