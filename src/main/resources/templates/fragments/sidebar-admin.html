<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="sidebar" class="sidebar" id="sidebar">

    <div class="sidebar-header">
        <a th:href="@{/admin/dashboard}" class="sidebar-brand">
            <i class="fas fa-graduation-cap"></i>
            <span class="sidebar-brand-text">UniReclaim</span>
        </a>

        <button class="sidebar-close-btn d-lg-none" onclick="toggleSidebar()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="sidebar-menu-wrapper">

        <ul class="sidebar-menu">

            <li class="sidebar-menu-item">
                <a th:href="@{/admin/dashboard}" class="sidebar-menu-link"
                   th:classappend="${#strings.contains(currentURI, '/dashboard') ? 'active' : ''}">
                    <i class="fas fa-tachometer-alt sidebar-menu-icon"></i>
                    <span class="sidebar-menu-text">Tableau de bord</span>
                </a>
            </li>

            <li class="sidebar-menu-item">
                <a th:href="@{/admin/utilisateurs}" class="sidebar-menu-link"
                   th:classappend="${#strings.contains(currentURI, '/utilisateurs') ? 'active' : ''}">
                    <i class="fas fa-users sidebar-menu-icon"></i>
                    <span class="sidebar-menu-text">Utilisateurs</span>
                </a>
            </li>

            <li class="sidebar-menu-item">
                <a th:href="@{/admin/departements}" class="sidebar-menu-link"
                   th:classappend="${#strings.contains(currentURI, '/departements') ? 'active' : ''}">
                    <i class="fas fa-building sidebar-menu-icon"></i>
                    <span class="sidebar-menu-text">Départements</span>
                </a>
            </li>

            <li class="sidebar-menu-item">
                <a th:href="@{/admin/filieres}" class="sidebar-menu-link"
                   th:classappend="${#strings.contains(currentURI, '/filieres') ? 'active' : ''}">
                    <i class="fas fa-sitemap sidebar-menu-icon"></i>
                    <span class="sidebar-menu-text">Filières</span>
                </a>
            </li>

            <li class="sidebar-menu-item">
                <a th:href="@{/admin/modules}" class="sidebar-menu-link"
                   th:classappend="${#strings.contains(currentURI, '/modules') ? 'active' : ''}">
                    <i class="fas fa-book sidebar-menu-icon"></i>
                    <span class="sidebar-menu-text">Modules</span>
                </a>
            </li>

            <li class="sidebar-menu-item">
                <a th:href="@{/admin/categories}" class="sidebar-menu-link"
                   th:classappend="${#strings.contains(currentURI, '/categories') ? 'active' : ''}">
                    <i class="fas fa-tags sidebar-menu-icon"></i>
                    <span class="sidebar-menu-text">Catégories</span>
                </a>
            </li>

            <li class="sidebar-menu-item">
                <a th:href="@{/admin/statistiques}" class="sidebar-menu-link"
                   th:classappend="${#strings.contains(currentURI, '/statistiques') ? 'active' : ''}">
                    <i class="fas fa-chart-bar sidebar-menu-icon"></i>
                    <span class="sidebar-menu-text">Statistiques</span>
                </a>
            </li>

        </ul>

        <div class="sidebar-divider"></div>

        <ul class="sidebar-menu">

            <li class="sidebar-menu-item">
                <a th:href="@{/admin/profil}" class="sidebar-menu-link"
                   th:classappend="${#strings.contains(currentURI, '/profil') ? 'active' : ''}">
                    <i class="fas fa-user-circle sidebar-menu-icon"></i>
                    <span class="sidebar-menu-text">Mon Profil</span>
                </a>
            </li>

            <!-- Déconnexion -->
            <li class="sidebar-menu-item">
                <form th:action="@{/logout}" method="post" style="margin:0;">

                    <button type="submit"
                            class="sidebar-menu-link sidebar-logout-link"
                            style="width:100%;
                                   border:none;
                                   background:none;
                                   text-align:left;
                                   display:flex;
                                   align-items:center;
                                   cursor:pointer;">

                        <i class="fas fa-sign-out-alt sidebar-menu-icon"></i>
                        <span class="sidebar-menu-text">Déconnexion</span>

                    </button>

                </form>
            </li>

        </ul>

    </div>

    <div class="sidebar-user">

        <div class="sidebar-user-avatar"
             th:text="${currentUser.initiale}">
            A
        </div>

        <div class="sidebar-user-info">

            <div class="sidebar-user-name"
                 th:text="${currentUser.prenom + ' ' + currentUser.nom}">
                Admin User
            </div>

            <div class="sidebar-user-role">
                Administrateur
            </div>

        </div>

    </div>

</div>

</html>
