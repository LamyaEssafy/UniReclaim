<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="header(pageTitle)" class="top-header">
    <div class="header-left">
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h4 class="header-title mb-0" th:text="${pageTitle}">Tableau de bord</h4>
    </div>
    <div class="header-right">
        <!-- Search Bar -->
        <div class="header-search d-none d-md-flex">
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0">
                    <i class="fas fa-search text-muted"></i>
                </span>
                <input type="text" class="form-control border-start-0 ps-0" placeholder="Rechercher...">
            </div>
        </div>

        <!-- Notification Bell -->
        <div class="notification-bell position-relative" id="notificationBell" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-bell"></i>
            <span class="notification-badge" th:style="${notificationCount != null and notificationCount > 0} ? 'display: flex;' : 'display: none;'" th:text="${notificationCount != null ? notificationCount : '0'}">0</span>
        </div>
        <ul class="dropdown-menu dropdown-menu-end notification-dropdown" aria-labelledby="notificationBell">
            <li class="dropdown-header d-flex justify-content-between align-items-center">
                <strong>Notifications</strong>
                <a href="#" class="text-primary text-decoration-none small">Tout marquer comme lu</a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li class="notification-empty text-center py-4 text-muted">
                <i class="fas fa-bell-slash fa-2x mb-2 d-block"></i>
                <span>Aucune nouvelle notification</span>
            </li>
        </ul>

        <!-- User Dropdown -->
        <div class="dropdown">
            <div class="user-dropdown" data-bs-toggle="dropdown" aria-expanded="false" role="button">
                <div class="user-avatar-sm" th:text="${currentUser != null ? currentUser.initiale : 'U'}">U</div>
                <span class="d-none d-md-inline" th:text="${currentUser != null ? currentUser.prenom : 'Utilisateur'}">Utilisateur</span>
                <i class="fas fa-chevron-down ms-1" style="font-size: 0.7rem;"></i>
            </div>
            <ul class="dropdown-menu dropdown-menu-end user-dropdown-menu">
                <li class="dropdown-header">
                    <div class="d-flex align-items-center">
                        <div class="user-avatar-sm me-2" th:text="${currentUser != null ? currentUser.initiale : 'U'}">U</div>
                        <div>
                            <div class="fw-semibold" th:text="${currentUser != null ? currentUser.prenom + ' ' + currentUser.nom : 'Utilisateur'}">Utilisateur</div>
                            <small class="text-muted" th:text="${currentUser != null ? currentUser.email : ''}">email@example.com</small>
                        </div>
                    </div>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" th:href="@{${currentUser.role.name() == 'ADMIN' ? '/admin/profil' : (currentUser.role.name() == 'CHEF' ? '/chef/profil' : (currentUser.role.name() == 'ENSEIGNANT' ? '/enseignant/profil' : '/etudiant/profil'))}}"><i class="fas fa-user me-2"></i>Mon Profil</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form id="headerLogoutForm" th:action="@{/logout}" method="post" style="display: none;"></form>
                    <a class="dropdown-item text-danger" href="javascript:void(0);" onclick="document.getElementById('headerLogoutForm').submit();">
                        <i class="fas fa-sign-out-alt me-2"></i>Déconnexion
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>

</html>
