<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Départements - UniReclaim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>
<body>
    <div class="app-container">
        <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>

        <div class="main-content">
            <div th:replace="~{fragments/header :: header('Gestion des Départements')}"></div>

            <div class="content-area animate-fade-in-up">
                <div class="row">
                    <!-- Left: Form -->
                    <div class="col-lg-4 mb-4">
                        <div class="card-custom">
                            <div class="card-header-custom">
                                <h5 class="mb-0">Nouveau Département</h5>
                            </div>
                            <div class="card-body p-4">
                                <form th:action="@{/admin/departements}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label form-label-custom">Nom</label>
                                        <input type="text" name="nom" class="form-control form-control-custom" placeholder="Nom du département" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label form-label-custom">Description</label>
                                        <textarea name="description" rows="4" class="form-control form-control-custom" placeholder="Description..."></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary-custom w-100 mt-2">Enregistrer</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Table -->
                    <div class="col-lg-8">
                        <div class="data-table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nom</th>
                                        <th>Description</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="d : ${departements}">
                                        <td th:text="${d.id}">1</td>
                                        <td th:text="${d.nom}">Nom</td>
                                        <td th:text="${d.description}">Description</td>
                                        <td>
                                            <a th:href="@{/admin/departements/{id}/supprimer(id=${d.id})}" class="btn btn-sm btn-light text-danger confirm-delete" title="Supprimer">
                                                <i class="fas fa-trash-alt"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
