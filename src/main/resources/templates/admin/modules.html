<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Modules - UniReclaim</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>

<body>

<div class="app-container">

    <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>

    <div class="main-content">

        <div th:replace="~{fragments/header :: header('Gestion des Modules')}"></div>

        <div class="content-area animate-fade-in-up">

            <div class="row">

                <!-- Formulaire -->
                <div class="col-lg-4">

                    <div class="card-custom">

                        <div class="card-header-custom">
                            <h5 class="mb-0">Nouveau Module</h5>
                        </div>

                        <div class="card-body">

                            <form th:action="@{/admin/modules}" method="post">

                                <div class="mb-3">
                                    <label class="form-label">Code</label>
                                    <input
                                            type="text"
                                            class="form-control"
                                            name="code"
                                            required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Nom</label>
                                    <input
                                            type="text"
                                            class="form-control"
                                            name="nom"
                                            required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Filière</label>

                                    <select
                                            class="form-select"
                                            name="filiereId"
                                            required>

                                        <option value="">Sélectionner</option>

                                        <option
                                                th:each="f : ${filieres}"
                                                th:value="${f.id}"
                                                th:text="${f.nom}">
                                        </option>

                                    </select>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Enseignant Responsable
                                    </label>

                                    <!-- CORRECTION ICI -->
                                    <select
                                            class="form-select"
                                            name="enseignantId"
                                            required>

                                        <option value="">Sélectionner</option>

                                        <option
                                                th:each="e : ${enseignants}"
                                                th:value="${e.id}"
                                                th:text="${e.prenom + ' ' + e.nom}">
                                        </option>

                                    </select>

                                </div>

                                <button
                                        type="submit"
                                        class="btn btn-primary w-100">

                                    Enregistrer

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

                <!-- Tableau -->

                <div class="col-lg-8">

                    <div class="card-custom">

                        <div class="card-header-custom">
                            <h5 class="mb-0">Liste des modules</h5>
                        </div>

                        <div class="card-body">

                            <table class="table table-hover">

                                <thead>

                                <tr>

                                    <th>Code</th>
                                    <th>Nom</th>
                                    <th>Filière</th>
                                    <th>Enseignant</th>
                                    <th>Actions</th>

                                </tr>

                                </thead>

                                <tbody>

                                <tr th:each="m : ${modules}">

                                    <td th:text="${m.code}"></td>

                                    <td th:text="${m.nom}"></td>

                                    <td th:text="${m.filiere != null ? m.filiere.nom : '-'}"></td>

                                    <!-- CORRECTION ICI -->
                                    <td th:text="${m.enseignantResponsable != null ? m.enseignantResponsable.prenom + ' ' + m.enseignantResponsable.nom : '-'}"></td>

                                    <td>

                                        <a
                                                th:href="@{/admin/modules/{id}/supprimer(id=${m.id})}"
                                                class="btn btn-danger btn-sm">

                                            <i class="fas fa-trash"></i>

                                        </a>

                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/app.js}"></script>

<script th:src="@{/js/notifications.js}"></script>

</body>

</html>
