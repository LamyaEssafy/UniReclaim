<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs - UniReclaim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>
<body>
    <div class="app-container">
        <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>

        <div class="main-content">
            <div th:replace="~{fragments/header :: header('Gestion des Utilisateurs')}"></div>

            <div class="content-area animate-fade-in-up">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0">Utilisateurs</h3>
                    <a th:href="@{/admin/utilisateurs/nouveau}" class="btn btn-primary-custom">
                        <i class="fas fa-user-plus me-2"></i> Nouvel Utilisateur
                    </a>
                </div>

                <div class="data-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Photo</th>
                                <th>Nom Complet</th>
                                <th>Email</th>
                                <th>Département</th>
                                <th>Rôle</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${utilisateurs}">
                                <td>
                                    <div class="user-avatar-sm" th:text="${user.initiale}">U</div>
                                </td>
                                <td th:text="${user.prenom + ' ' + user.nom}">Nom</td>
                                <td th:text="${user.email}">Email</td>
                                <td th:text="${user.departement != null ? user.departement.nom : '-'}">Département</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${user.role}">ROLE</span>
                                </td>
                                <td>
                                    <span class="badge bg-success" th:if="${user.actif}">Actif</span>
                                    <span class="badge bg-danger" th:if="${!user.actif}">Inactif</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/utilisateurs/{id}/modifier(id=${user.id})}" class="btn btn-sm btn-light text-primary me-1" title="Modifier">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/admin/utilisateurs/{id}/toggle(id=${user.id})}" class="btn btn-sm btn-light text-warning me-1" title="Activer/Désactiver">
                                        <i class="fas fa-power-off"></i>
                                    </a>
                                    <a th:href="@{/admin/utilisateurs/{id}/supprimer(id=${user.id})}" class="btn btn-sm btn-light text-danger confirm-delete" title="Supprimer">
                                        <i class="fas fa-trash-alt"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
