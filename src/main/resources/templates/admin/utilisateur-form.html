<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enregistrer Utilisateur - UniReclaim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>
<body>
    <div class="app-container">
        <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>

        <div class="main-content">
            <div th:replace="~{fragments/header :: header('Enregistrer Utilisateur')}"></div>

            <div class="content-area animate-fade-in-up">
                <div class="card-custom max-width-800 mx-auto">
                    <div class="card-header-custom">
                        <h4 class="mb-0" th:text="${utilisateur.id == null ? 'Nouvel Utilisateur' : 'Modifier Utilisateur'}">Utilisateur</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/utilisateurs}" method="post" th:object="${utilisateur}">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label form-label-custom">Prénom</label>
                                    <input type="text" th:field="*{prenom}" class="form-control form-control-custom" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label form-label-custom">Nom</label>
                                    <input type="text" th:field="*{nom}" class="form-control form-control-custom" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label form-label-custom">Adresse Email</label>
                                    <input type="email" th:field="*{email}" class="form-control form-control-custom" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label form-label-custom">Téléphone</label>
                                    <input type="tel" th:field="*{telephone}" class="form-control form-control-custom" required>
                                </div>
                            </div>

                            <div class="mb-3" th:if="${utilisateur.id == null}">
                                <label class="form-label form-label-custom">Mot de passe</label>
                                <input type="password" th:field="*{motDePasse}" class="form-control form-control-custom" required autocomplete="new-password">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label form-label-custom">Rôle</label>
                                    <select th:field="*{role}" class="form-select form-control-custom" required>
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label form-label-custom">Département</label>
                                    <select th:field="*{departement}" class="form-select form-control-custom">
                                        <option value="">Sélectionnez un département</option>
                                        <option th:each="d : ${departements}" th:value="${d.id}" th:text="${d.nom}">Département</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/admin/utilisateurs}" class="btn btn-light">Annuler</a>
                                <button type="submit" class="btn btn-primary-custom">Enregistrer</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
