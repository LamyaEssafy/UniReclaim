<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Réclamations - UniReclaim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
</head>
<body>
    <div class="app-container">
        <div th:replace="~{fragments/sidebar-etudiant :: sidebar}"></div>

        <div class="main-content">
            <div th:replace="~{fragments/header :: header('Historique des Réclamations')}"></div>

            <div class="content-area animate-fade-in-up">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0">Mes Réclamations</h3>
                    <a th:href="@{/etudiant/reclamations/nouvelle}" class="btn btn-primary-custom">
                        <i class="fas fa-plus-circle me-2"></i> Nouvelle Réclamation
                    </a>
                </div>

                <div class="data-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Sujet</th>
                                <th>Catégorie</th>
                                <th>Date de création</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${reclamations}">
                                <td>
                                    <a th:href="@{/etudiant/reclamations/{id}(id=${r.id})}" class="font-weight-bold text-decoration-none" th:text="${r.code}">REC-001</a>
                                </td>
                                <td th:text="${r.sujet}">Sujet</td>
                                <td th:text="${r.categorie != null ? r.categorie.nom : '-'}">Catégorie</td>
                                <td th:text="${#temporals.format(r.dateCreation, 'dd/MM/yyyy HH:mm')}">Date</td>
                                <td>
                                    <span class="badge-status" th:classappend="'badge-' + ${#strings.toLowerCase(r.statut.name()).replace('_', '-')}" th:text="${r.statut}">Statut</span>
                                </td>
                                <td>
                                    <a th:href="@{/etudiant/reclamations/{id}(id=${r.id})}" class="btn btn-sm btn-light text-primary">
                                        <i class="fas fa-eye me-1"></i> Consulter
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(reclamations)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="fas fa-folder-open fa-3x mb-3 d-block"></i>
                                    Aucune réclamation enregistrée dans votre historique.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
